<svg xmlns="http://www.w3.org/2000/svg" width="456" height="434" viewBox="0 0 456 434" role="img" aria-label="ASCII portrait of Andrei">
<rect width="100%" height="100%" fill="#0d1117" rx="6"/>
<style>
  text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
          font-size: 7.0px; fill: #8b949e; white-space: pre; }
  .row { animation: wipe 0.28s linear both; }
  .gold { fill: #d4af37; animation: glint 1.5s ease-in-out 1.9s 2; }
  @keyframes glint {
    0%, 100% { opacity: 1; }
    45%      { opacity: 0.55; }
  }
  @keyframes wipe {
    from { clip-path: inset(0 100% 0 0); }
    to   { clip-path: inset(0 0 0 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .row, .gold { animation: none; }
  }
</style>
