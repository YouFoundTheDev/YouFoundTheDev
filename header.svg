<svg xmlns="http://www.w3.org/2000/svg" width="860" height="92" viewBox="0 0 860 92" role="img" aria-label="Andrei, software engineer">
<rect x="0.5" y="0.5" width="859" height="91" rx="8" fill="#0d1117" stroke="#21262d"/>
<text x="26" y="34" class="prompt">andrei@github</text>
<text x="146" y="34" class="prompt dim">~ $</text>
<text x="186" y="34" class="cmd">whoami --long</text>
<rect class="caret" x="330" y="21" width="8" height="17" rx="1" fill="#39d353"/>
<text x="26" y="66" class="name">Andrei</text>
<circle cx="26" cy="80" r="3" fill="#d4af37"/>
<text x="38" y="84" class="role">software engineer  ·  security  ·  systems</text>
<style>
  text { font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
  .prompt { font-size: 12px; fill: #39d353; font-weight: 700; }
  .prompt.dim { fill: #6e7681; font-weight: 400; }
  .cmd { font-size: 12px; fill: #c9d1d9; }
  .name { font-size: 21px; font-weight: 700; fill: #f0f6fc; }
  .role { font-size: 12.5px; fill: #6e7681; }
  .caret { animation: blink 1.05s steps(1) infinite; }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
</style>
</svg>
